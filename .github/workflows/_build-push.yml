name: Reusable build and push

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        type: string
      ref:
        description: Git ref or SHA to check out
        required: false
        type: string
        default: ""
      source_tag:
        description: Existing commit image tag to promote; empty builds or reuses the commit image
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: Digest of the published image
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: Image repository
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.published.outputs.digest }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Resolve image
        id: image
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$owner/hiss" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        if: inputs.source_tag == ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      - name: Resolve checked-out revision
        if: inputs.source_tag == ''
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find existing commit image
        if: inputs.source_tag == ''
        id: existing
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}' 2>"$error_file")"; then
            if ! docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' |
              jq -e --arg sha "$COMMIT_SHA" \
                '[.. | objects | select(.config? | type == "object") | .config.Labels["org.opencontainers.image.revision"]] | length > 0 and all(. == $sha)' >/dev/null; then
              echo "Commit image revision does not match $COMMIT_SHA: $IMAGE@$digest" >&2
              exit 1
            fi
            echo "Reusing $IMAGE:$TAG at $digest"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            error="$(cat "$error_file")"
            case "$error" in
              *': not found'*|*'manifest unknown'*|*'MANIFEST_UNKNOWN'*|*'404 Not Found'*)
                echo "Commit image $IMAGE:$TAG not found; building it"
                ;;
              *)
                echo "Cannot check commit image $IMAGE:$TAG: $error" >&2
                exit 1
                ;;
            esac
          fi
      # Self-hosted runners can be amd64 Linux or arm64 Macs: publish both.
      - name: Set up QEMU
        if: inputs.source_tag == '' && steps.existing.outputs.digest == ''
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        if: inputs.source_tag == '' && steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        if: inputs.source_tag == '' && steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VCS_REF=${{ steps.revision.outputs.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            IMAGE_VERSION=${{ inputs.tag }}
          tags: ${{ steps.image.outputs.image }}:${{ inputs.tag }}
      - name: Promote existing image
        if: inputs.source_tag != ''
        id: promote
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          COMMIT_SHA: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! digest="$(docker buildx imagetools inspect "$IMAGE:$SOURCE_TAG" --format '{{.Manifest.Digest}}')"; then
            echo "Commit image $IMAGE:$SOURCE_TAG not found or cannot be read; wait for cd-dev to publish it" >&2
            exit 1
          fi
          if ! docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' |
            jq -e --arg sha "$COMMIT_SHA" \
              '[.. | objects | select(.config? | type == "object") | .config.Labels["org.opencontainers.image.revision"]] | length > 0 and all(. == $sha)' >/dev/null; then
            echo "Commit image revision does not match $COMMIT_SHA: $IMAGE@$digest" >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$RELEASE_TAG" "$IMAGE@$digest"
          promoted="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{.Manifest.Digest}}')"
          if [ "$promoted" != "$digest" ]; then
            echo "Promoted digest $promoted differs from source $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record published digest
        id: published
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest || steps.promote.outputs.digest }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE:$TAG at $DIGEST" >> "$GITHUB_STEP_SUMMARY"
