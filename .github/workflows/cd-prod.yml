name: CD — prod

# Safety invariant: this workflow deploys only owner-controlled immutable Release Tag pushes.
# Never add pull_request: untrusted fork code must not execute on the self-hosted runner.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Require green CI
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Wait for CI success on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Commit $sha is not reachable from main" >&2
            exit 1
          fi
          for _ in $(seq 1 60); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --event push --branch main --limit 1 --json status,conclusion --jq '.[0] | "\(.status):\(.conclusion)"')"
            case "$row" in
              completed:success) exit 0 ;;
              completed:failure|completed:cancelled|completed:timed_out|completed:startup_failure)
                echo "CI $row" >&2
                exit 1
                ;;
              *:*) echo "CI $row; waiting" ;;
              *) echo "No CI run yet; waiting" ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for CI on $sha" >&2
          exit 1

  prepare:
    name: Resolve prod image tag
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha8: ${{ steps.tag.outputs.sha8 }}
    steps:
      - name: Set Release Tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha8=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

  build:
    name: Promote prod image
    needs: prepare
    uses: ./.github/workflows/_build-push.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_tag: ${{ needs.prepare.outputs.sha8 }}
      ref: ${{ github.sha }}
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy prod
    permissions:
      contents: read
    needs:
      - prepare
      - build
    runs-on: [self-hosted]
    timeout-minutes: 15
    environment:
      name: prod
    env:
      DEPLOY_TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Pull prod image
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" IMAGE_TAG="$DEPLOY_TAG@$DIGEST" APP_VERSION="$DEPLOY_TAG" \
            docker compose -f deploy/compose.yml --env-file deploy/prod.env -p hiss-prod pull
      - name: Start prod services
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" IMAGE_TAG="$DEPLOY_TAG@$DIGEST" APP_VERSION="$DEPLOY_TAG" \
            docker compose -f deploy/compose.yml --env-file deploy/prod.env -p hiss-prod up -d --no-build --pull never

  smoke-test:
    name: Smoke test prod
    needs:
      - prepare
      - deploy
    runs-on: [self-hosted]
    timeout-minutes: 5
    env:
      DEPLOY_TAG: ${{ needs.prepare.outputs.tag }}
      BASE_URL: http://localhost:8003
    steps:
      - name: Check prod probes and version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/healthz"
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/readyz"
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/version" \
            | jq --exit-status --arg expected "$DEPLOY_TAG" '.version == $expected' >/dev/null
