name: Rollback

# Safety invariant: this workflow deploys only owner-controlled manual dispatches.
# Never add pull_request: untrusted fork code must not execute on the self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to redeploy
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      tag:
        description: Existing image tag to redeploy
        required: true
        type: string

permissions: {}

concurrency:
  group: cd-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Roll back ${{ inputs.environment }}
    permissions:
      contents: read
    runs-on: [self-hosted]
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      DEPLOY_TAG: ${{ inputs.tag }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check out workflow ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Resolve image
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/$owner/hiss" >> "$GITHUB_ENV"
      - name: Pull selected image
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            dev) env_file=dev.env; project=hiss-dev ;;
            staging) env_file=staging.env; project=hiss-staging ;;
            prod) env_file=prod.env; project=hiss-prod ;;
            *) echo "Unsupported environment: $TARGET_ENV" >&2; exit 1 ;;
          esac
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" IMAGE_TAG="$DEPLOY_TAG" APP_VERSION="$DEPLOY_TAG" \
            docker compose -f deploy/compose.yml --env-file "deploy/$env_file" -p "$project" pull
      - name: Start selected services
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            dev) env_file=dev.env; project=hiss-dev ;;
            staging) env_file=staging.env; project=hiss-staging ;;
            prod) env_file=prod.env; project=hiss-prod ;;
            *) echo "Unsupported environment: $TARGET_ENV" >&2; exit 1 ;;
          esac
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" IMAGE_TAG="$DEPLOY_TAG" APP_VERSION="$DEPLOY_TAG" \
            docker compose -f deploy/compose.yml --env-file "deploy/$env_file" -p "$project" up -d --no-build --pull never

  smoke-test:
    name: Smoke test ${{ inputs.environment }} rollback
    needs: deploy
    runs-on: [self-hosted]
    timeout-minutes: 5
    env:
      TARGET_ENV: ${{ inputs.environment }}
      DEPLOY_TAG: ${{ inputs.tag }}
    steps:
      - name: Select environment endpoint
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            dev) port=8001 ;;
            staging) port=8002 ;;
            prod) port=8003 ;;
            *) echo "Unsupported environment: $TARGET_ENV" >&2; exit 1 ;;
          esac
          echo "base_url=http://localhost:$port" >> "$GITHUB_OUTPUT"
      - name: Check rollback probes and version
        shell: bash
        env:
          BASE_URL: ${{ steps.endpoint.outputs.base_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/healthz"
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/readyz"
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/version" \
            | jq --exit-status --arg expected "$DEPLOY_TAG" '.version == $expected' >/dev/null
