name: CD — dev

# Safety invariant: deploy only after CI succeeds for an owner-controlled
# push to main. Never add pull_request. The job-level filter on
# workflow_run.event == push && head_branch == main is required so a green
# pull_request CI run cannot start a deploy on the self-hosted runner.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: cd-dev
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve dev image tag
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set 8-character SHA tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${HEAD_SHA:0:8}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push dev image
    needs: prepare
    uses: ./.github/workflows/_build-push.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy dev
    permissions:
      contents: read
    needs:
      - prepare
      - build
    runs-on: [self-hosted]
    timeout-minutes: 15
    environment:
      name: dev
    env:
      DEPLOY_TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Pull dev image
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" IMAGE_TAG="$DEPLOY_TAG@$DIGEST" APP_VERSION="$DEPLOY_TAG" \
            docker compose -f deploy/compose.yml --env-file deploy/dev.env -p hiss-dev pull
      - name: Start dev services
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" IMAGE_TAG="$DEPLOY_TAG@$DIGEST" APP_VERSION="$DEPLOY_TAG" \
            docker compose -f deploy/compose.yml --env-file deploy/dev.env -p hiss-dev up -d --no-build --pull never

  smoke-test:
    name: Smoke test dev
    needs:
      - prepare
      - deploy
    runs-on: [self-hosted]
    timeout-minutes: 5
    env:
      DEPLOY_TAG: ${{ needs.prepare.outputs.tag }}
      BASE_URL: http://localhost:8001
    steps:
      - name: Check dev probes and version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/healthz"
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/readyz"
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-connrefused "$BASE_URL/version" \
            | jq --exit-status --arg expected "$DEPLOY_TAG" '.version == $expected' >/dev/null
