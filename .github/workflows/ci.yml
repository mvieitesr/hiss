name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      app: ${{ steps.filter.outputs.app }}
      cli: ${{ steps.filter.outputs.cli }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'app/**'
            cli:
              - 'cli/**'
            shared:
              - 'pytest.ini'
              - 'ruff.toml'
              - '.github/workflows/**'
              - 'deploy/**'
              - 'compose.yml'

  lint-pipeline:
    name: Validate workflows and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: Validate Compose configurations
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD=dummy IMAGE=ghcr.io/student/hiss IMAGE_TAG=12345678 APP_VERSION=12345678
          for environment in dev staging prod; do
            for compose in compose.yml deploy/compose.yml; do
              docker compose -f "$compose" --env-file "deploy/$environment.env" -p hiss-ci config -q
            done
          done

  lint:
    name: Lint Python
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            cli/requirements.txt
      - name: Install Ruff
        run: python -m pip install 'ruff==0.9.10'
      - name: Check lint
        run: ruff check app cli
      - name: Check formatting
        run: ruff format --check app cli

  lint-docker:
    name: Lint Dockerfile
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0-alpine < app/Dockerfile

  test-app:
    name: Test app
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hiss_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hiss_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hiss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
      - name: Install app dependencies
        run: python -m pip install -r app/requirements-dev.txt
      - name: Apply migrations
        run: alembic -c app/alembic.ini upgrade head
      - name: Run app tests
        run: pytest app/tests

  test-cli:
    name: Test CLI
    needs: changes
    if: >-
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cli/requirements.txt
      - name: Install CLI dependencies
        run: python -m pip install -r cli/requirements.txt
      - name: Install local CLI package
        run: python -m pip install -e cli
      - name: Run CLI tests
        run: pytest cli/tests

  build:
    name: Build app image
    needs:
      - changes
      - test-app
    if: >-
      needs.changes.outputs.app == 'true' &&
      needs.test-app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build app image
        run: docker build -f app/Dockerfile app/
