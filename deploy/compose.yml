# Hiss — parameterized compose for three Environments (RA1: build once, deploy anywhere)
# Teaching demo: multi-service, healthchecks, named volume, env-file config.
# Usage:
#   POSTGRES_PASSWORD=... docker compose --env-file deploy/dev.env up -d
#   POSTGRES_PASSWORD=... docker compose --env-file deploy/staging.env -p hiss-staging up -d
#   POSTGRES_PASSWORD=... docker compose --env-file deploy/prod.env -p hiss-prod up -d
# Project name isolation via COMPOSE_PROJECT_NAME in env file or -p flag.
name: ${COMPOSE_PROJECT_NAME:-hiss-dev}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiss}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hiss}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Intentionally no ports published — avoids collision with host postgres on 5432

  app:
    image: ${IMAGE}:${IMAGE_TAG:?must be set}
    build:
      context: ../app
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?must be set}@db:5432/${POSTGRES_DB:-hiss}
      APP_VERSION: ${APP_VERSION:?must be set}
      FEATURE_LABEL_FILTERING: ${FEATURE_LABEL_FILTERING:-true}
      # Pass through DB vars for clarity / 12-factor completeness
      POSTGRES_DB: ${POSTGRES_DB:-hiss}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    healthcheck:
      # python is guaranteed in python:3.13-slim; no extra tools needed
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8000/healthz\",timeout=3); sys.exit(0)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    # 12-factor: no env_file here — configuration injected via --env-file flag at deploy time

volumes:
  pgdata:
