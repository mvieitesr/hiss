# Hiss — blue-green deployment demo (self-contained)
# Self-contained demo under deploy/blue-green: two app slots (blue/green)
# behind an nginx reverse proxy. Only the proxy publishes a host port.
# Usage:
#   POSTGRES_PASSWORD=... docker compose -f deploy/blue-green/compose.yml up -d
#   # or with env file:
#   docker compose -f deploy/blue-green/compose.yml --env-file deploy/blue-green/.env.example up -d
# See deploy/blue-green/README.es.md for the teaching walkthrough.
name: ${COMPOSE_PROJECT_NAME:-hiss-blue-green}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiss}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set - see README.es.md}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hiss}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # No ports published — DB is only reachable via internal DNS `db:5432`

  # Run migrations once before either slot starts. The deployed tag can override
  # MIGRATE_TAG so its migrations run before replacing the inactive slot.
  migrate:
    image: ${IMAGE:-ghcr.io/vieitesss/hiss}:${MIGRATE_TAG:-${GREEN_TAG:-0.1.1}}
    entrypoint: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?must be set}@db:5432/${POSTGRES_DB:-hiss}

  blue:
    image: ${IMAGE:-ghcr.io/vieitesss/hiss}:${BLUE_TAG:-0.1.0}
    entrypoint: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "app.wsgi:app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?must be set}@db:5432/${POSTGRES_DB:-hiss}
      APP_VERSION: ${BLUE_TAG:-0.1.0}
      FEATURE_LABEL_FILTERING: ${FEATURE_LABEL_FILTERING:-true}
      POSTGRES_DB: ${POSTGRES_DB:-hiss}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    healthcheck:
      # python is guaranteed in python:3.13-slim; no extra tools needed
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8000/healthz\",timeout=3); sys.exit(0)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  green:
    image: ${IMAGE:-ghcr.io/vieitesss/hiss}:${GREEN_TAG:-0.1.1}
    entrypoint: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "app.wsgi:app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?must be set}@db:5432/${POSTGRES_DB:-hiss}
      APP_VERSION: ${GREEN_TAG:-0.1.1}
      FEATURE_LABEL_FILTERING: ${FEATURE_LABEL_FILTERING:-true}
      POSTGRES_DB: ${POSTGRES_DB:-hiss}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8000/healthz\",timeout=3); sys.exit(0)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      # Proxy can start once both slots are created; they may still be
      # becoming healthy — traffic will go only to $ACTIVE_SLOT.
      blue:
        condition: service_started
      green:
        condition: service_started
      db:
        condition: service_healthy
    ports:
      - "${BLUE_GREEN_PORT:-9000}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - proxy-state:/var/lib/hiss-blue-green
    environment:
      ACTIVE_SLOT: ${ACTIVE_SLOT:-blue}
    # A project-scoped volume retains the selected slot across proxy recreation.
    command:
      - /bin/sh
      - -c
      - |
        if [ -f /var/lib/hiss-blue-green/active-slot ]; then
          ACTIVE_SLOT=$$(cat /var/lib/hiss-blue-green/active-slot)
        fi
        case "$$ACTIVE_SLOT" in
          blue|green) ;;
          *) echo "Invalid active slot: $$ACTIVE_SLOT" >&2; exit 1 ;;
        esac
        export ACTIVE_SLOT
        envsubst '$${ACTIVE_SLOT}' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  proxy-state:
