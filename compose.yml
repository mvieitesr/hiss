# Hiss — root compose wrapper (for `docker compose --env-file deploy/<env>.env` from repo root)
# Source of truth is deploy/compose.yml; this file mirrors it with build context adjusted.
# Usage (both work):
#   docker compose --env-file deploy/dev.env up -d          # uses this file (root)
#   docker compose -f deploy/compose.yml --env-file deploy/dev.env up -d  # uses deploy file
name: ${COMPOSE_PROJECT_NAME:-hiss-dev}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiss}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hiss}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    image: ${IMAGE}:${IMAGE_TAG:?must be set}
    build:
      context: app
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?must be set}@db:5432/${POSTGRES_DB:-hiss}
      APP_VERSION: ${APP_VERSION:?must be set}
      FEATURE_LABEL_FILTERING: ${FEATURE_LABEL_FILTERING:-true}
      POSTGRES_DB: ${POSTGRES_DB:-hiss}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8000/healthz\",timeout=3); sys.exit(0)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
