[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hiss-cli"
version = "0.1.0"
description = "hiss CLI — Typer + httpx client for the hiss API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer==0.27.3",
    "httpx==0.28.1",
    "rich==15.0.0",
]

[project.scripts]
hiss = "hiss.main:app"

[tool.setuptools]
packages = ["hiss"]
